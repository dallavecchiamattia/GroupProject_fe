<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Bentornato</h1>
        <p>Accedi al tuo conto Banca Lume</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="nome.cognome@esempio.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>

        @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
        }

        <button class="btn-submit" [disabled]="loginForm.invalid" type="submit">Sign In</button>

        <button class="btn-link" type="button" routerLink="/register">
          Non hai un account? Registrati adesso
        </button>
      </form>
    </div>
  </div>
</div>
