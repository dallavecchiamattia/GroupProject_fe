<div class="container mt-5">
  <div class="row">
    <div class="col col-lg-4"></div>

    <div class="col col-lg-4 col-md-12 border rounded p-4">
      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="form-outline mb-4">
          <label class="form-label">Nome</label>
          <input class="form-control" type="text" formControlName="nomeTitolare">
        </div>

        <div class="form-outline mb-4">
          <label class="form-label">Cognome</label>
          <input class="form-control" type="text" formControlName="cognomeTitolare">
        </div>

        <div class="form-outline mb-4">
          <label class="form-label">Email Address</label>
          <input class="form-control" type="email" formControlName="email">
        </div>

        <div class="form-outline mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" formControlName="password">
        </div>

        <div class="form-outline mb-4">
          <label class="form-label">Conferma Password</label>
          <input class="form-control" type="password" formControlName="confermaNuovaPassword">
        </div>

        <div class="text-danger">
          {{ errorMessage() }}
        </div>

        <div class="text-center">
          <button [disabled]="registerForm.invalid" type="submit" class="btn btn-primary btn-block mb-4">
            Register</button>
        </div>
      </form>
    </div>
  </div>

</div>
