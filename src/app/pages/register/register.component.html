@if(!authSrv.isAuthenticated()) {
<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Crea il tuo conto</h1>
        <p>Registrati su Banca Lume in pochi secondi</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="form-row">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" formControlName="nomeTitolare" placeholder="Mario">
          </div>

          <div class="form-group">
            <label>Cognome</label>
            <input type="text" formControlName="cognomeTitolare" placeholder="Rossi">
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="nome@esempio.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label>Conferma Password</label>
          <input type="password" formControlName="confermaPassword" placeholder="••••••••">
        </div>

        @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
        }

        <button class="btn-submit" [disabled]="registerForm.invalid" type="submit">Register</button>
      </form>

      <button class="btn-link" type="button" routerLink="/login">
        hai già un account? fai il login
      </button>
    </div>
  </div>
</div>
} @else {
<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card already-auth">
      <div class="already-auth-icon">✓</div>
      <h1>Sei già autenticato</h1>
      <p>Il tuo account è già collegato, non serve registrarsi di nuovo.</p>
      <a class="btn-submit btn-link-as-button" [routerLink]="['/home']">Vai alla home</a>
    </div>
  </div>
</div>
}
