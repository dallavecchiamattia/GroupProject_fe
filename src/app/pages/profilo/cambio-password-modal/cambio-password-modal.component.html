<h2>Modifica password</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <input type="password" formControlName="vecchiaPassword" placeholder="Password attuale" />
  <input type="password" formControlName="nuovaPassword" placeholder="Nuova password" />
  <input type="password" formControlName="confermaNuovaPassword" placeholder="Conferma nuova password" />
  @if (errore()) { <p class="errore">{{ errore() }}</p> }
  <div class="azioni">
    <button type="button" (click)="activeModal.dismiss()">Annulla</button>
    <button type="submit" [disabled]="form.invalid || inCorso()">Salva</button>
  </div>
</form>
