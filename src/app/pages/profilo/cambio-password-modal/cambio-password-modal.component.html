<div class="modal-dark">
  <h2 class="modal-title">Modifica password</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Password attuale</label>
      <input type="password" formControlName="vecchiaPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Nuova password</label>
      <input type="password" formControlName="nuovaPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Conferma nuova password</label>
      <input type="password" formControlName="confermaNuovaPassword" placeholder="••••••••" />
    </div>

    @if (errore()) {
    <div class="error-message">{{ errore() }}</div>
    }

    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="activeModal.dismiss()">Annulla</button>
      <button type="submit" class="btn-submit" [disabled]="form.invalid || inCorso()">
        {{ inCorso() ? 'Salvataggio...' : 'Salva' }}
      </button>
    </div>
  </form>
</div>
