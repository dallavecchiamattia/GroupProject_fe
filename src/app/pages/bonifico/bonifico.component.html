<div class="bonifico-page">

  <div class="bonifico-card">
    <form [formGroup]="bonificoForm" (ngSubmit)="invia()">

      <div class="page-header">
        <p class="page-eyebrow">Pagamenti</p>
        <h2 class="page-title">Bonifico</h2>
      </div>

      <div class="field">
        <label for="iban" class="field-label">IBAN destinatario</label>
        <input id="iban" class="field-input" type="text" formControlName="ibanDestinatario"
          placeholder="Es. IT60X0542811101000000123456" />
      </div>

      <div class="field">
        <label for="importo" class="field-label">Importo</label>
        <div class="input-prefix">
          <span class="prefix">&euro;</span>
          <input id="importo" class="field-input" type="number" step="0.01" min="0.01" formControlName="importo" />
        </div>
      </div>

      @if (errorMessage()) {
      <div class="form-error">
        {{ errorMessage() }}
      </div>
      }

      @if (esito(); as esito) {
      <div class="form-success">
        <p class="success-title">Bonifico effettuato con successo!</p>
        <p class="success-text">
          Nuovo saldo: <strong>{{ esito.saldo | currency:'EUR' }}</strong>
        </p>
        <a class="success-link" [routerLink]="['/movimenti', esito.id]">
          Vedi il dettaglio del movimento
        </a>
      </div>
      }

      <button class="btn-primary btn-submit" type="submit" [disabled]="bonificoForm.invalid || isSubmitting()">
        @if (isSubmitting()) {
        Invio in corso...
        } @else {
        Invia bonifico
        }
      </button>

    </form>
  </div>

</div>
