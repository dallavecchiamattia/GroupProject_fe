<div class="ricarica-container">
  <div class="form-card">

    <!-- Title & Eyebrow -->
    <div class="card-header-custom">
      <p class="section-eyebrow">Servizi</p>
      <h2 class="form-title">Ricarica telefonica</h2>
    </div>

    <form (ngSubmit)="effettuaRicarica()">

      <!-- Numero telefonico -->
      <div class="form-group">
        <label for="numeroTelefonico" class="form-label">Numero telefonico</label>
        <input type="tel" class="form-control" id="numeroTelefonico" name="numeroTelefonico"
          [(ngModel)]="numeroTelefonico" placeholder="+39 333 123 4567" required />
      </div>

      <!-- Operatore -->
      <div class="form-group">
        <label for="operatore" class="form-label">Operatore</label>
        <select class="form-control form-select" id="operatore" name="operatore" [(ngModel)]="operatore">
          <option value="iliad">Iliad</option>
          <option value="tim">TIM</option>
          <option value="vodafone">Vodafone</option>
          <option value="windtre">WindTre</option>
          <option value="postemobile">PosteMobile</option>
        </select>
      </div>

      <!-- Importo -->
      <div class="form-group">
        <label for="taglio" class="form-label">Importo</label>
        <select class="form-control form-select" id="taglio" name="taglio" [(ngModel)]="taglio">
          <option [ngValue]="5">€ 5,00</option>
          <option [ngValue]="10">€ 10,00</option>
          <option [ngValue]="20">€ 20,00</option>
          <option [ngValue]="30">€ 30,00</option>
          <option [ngValue]="50">€ 50,00</option>
        </select>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
      <div class="alert-message error-message">
        {{ errorMessage() }}
      </div>
      }

      <!-- Success Message -->
      @if (ricaricaEffettuata) {
      <div class="alert-message success-message">
        ✓ Ricarica effettuata con successo!
      </div>
      }

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" [disabled]="!numeroTelefonico">
        Effettua ricarica
      </button>

    </form>

  </div>
</div>
