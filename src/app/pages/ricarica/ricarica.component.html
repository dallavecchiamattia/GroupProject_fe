<div class="ricarica-page">

  <div class="ricarica-card">
    <form (ngSubmit)="effettuaRicarica()">

      <div class="page-header">
        <p class="page-eyebrow">Servizi</p>
        <h2 class="page-title">Ricarica telefonica</h2>
      </div>

      <div class="field">
        <label for="numeroTelefonico" class="field-label">Numero telefonico</label>
        <input id="numeroTelefonico" name="numeroTelefonico" class="field-input" type="tel"
          [(ngModel)]="numeroTelefonico" placeholder="+39 333 123 4567" required />
      </div>

      <div class="field">
        <label for="operatore" class="field-label">Operatore</label>
        <select id="operatore" name="operatore" class="field-input" [(ngModel)]="operatore">
          <option value="iliad">Iliad</option>
          <option value="tim">TIM</option>
          <option value="vodafone">Vodafone</option>
          <option value="windtre">WindTre</option>
          <option value="postemobile">PosteMobile</option>
        </select>
      </div>

      <div class="field">
        <label for="taglio" class="field-label">Importo</label>
        <select id="taglio" name="taglio" class="field-input" [(ngModel)]="taglio">
          <option [ngValue]="5">€ 5,00</option>
          <option [ngValue]="10">€ 10,00</option>
          <option [ngValue]="20">€ 20,00</option>
          <option [ngValue]="30">€ 30,00</option>
          <option [ngValue]="50">€ 50,00</option>
        </select>
      </div>

      @if (errorMessage()) {
      <div class="form-error">
        {{ errorMessage() }}
      </div>
      }

      @if (ricaricaEffettuata) {
      <div class="form-success">
        <p class="success-title">✓ Ricarica effettuata con successo!</p>
      </div>
      }

      <button class="btn-primary btn-submit" type="submit" [disabled]="!numeroTelefonico">
        Effettua ricarica
      </button>

    </form>
  </div>

</div>
