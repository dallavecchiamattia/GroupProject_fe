<nav class="navbar">
  <div class="navbar-inner">
    @if (authService.isAuthenticated()) {
    <button type="button" class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
      aria-label="Apri il menu di navigazione">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        @if (menuOpen()) {
        <path d="M6 6l12 12M18 6L6 18" />
        } @else {
        <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
    }

    <a class="navbar-brand" [routerLink]="['/']" (click)="closeMenu()">
      Banca Lume
    </a>

    <div class="navbar-content">

      @if (authService.isAuthenticated()) {
      <ul class="navbar-links" [class.open]="menuOpen()" (click)="closeMenu()">
        <li>
          <a class="nav-link" [routerLink]="['/home']" routerLinkActive="active">Home</a>
        </li>
        <li>
          <a class="nav-link" [routerLink]="['/movimenti']" routerLinkActive="active">Movimenti</a>
        </li>
        <li>
          <a class="nav-link" [routerLink]="['/ricarica']" routerLinkActive="active">Ricarica</a>
        </li>
        <li>
          <a class="nav-link" [routerLink]="['/bonifici']" routerLinkActive="active">Bonifico</a>
        </li>
      </ul>

      <div ngbDropdown placement="bottom-end" display="dynamic" class="user-dropdown">
        <button type="button" class="user-btn" id="userMenu" ngbDropdownToggle>
          @if (authService.currentUser(); as user) {
          <span class="user-avatar">{{ user.nomeTitolare[0] }}{{ user.cognomeTitolare[0] }}</span>
          <span class="user-name">
            {{ user.nomeTitolare }} {{ user.cognomeTitolare }}
          </span>
          }
        </button>

        <div ngbDropdownMenu class="user-menu" aria-labelledby="userMenu">
          <a class="menu-item" [routerLink]="['/home']" ngbDropdownItem>
            Area personale
          </a>

          <a class="menu-item" [routerLink]="['/profilo']" ngbDropdownItem>
            Profilo
          </a>

          <div class="menu-divider"></div>

          <button class="menu-item logout" (click)="authService.logout(); closeMenu()">
            Logout
          </button>
        </div>
      </div>
      } @else {
      <a class="login-btn" [routerLink]="['/login']">
        Login
      </a>
      }

    </div>
  </div>
</nav>
